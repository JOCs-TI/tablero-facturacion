<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.15.0/umd/Recharts.js"></script>
<style>
:root {
  --bg: #F4F5F7; --card: #FFFFFF; --border: #E3E6EA;
  --text: #1C2A3A; --sub: #6B7280;
  --pos-bg: #E6F4EA; --pos-txt: #1E7E34;
  --neg-bg: #FDEAEA; --neg-txt: #C0392B;
  --azul: #244072; --ambar: #c98a2e;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); font-family: 'Segoe UI', system-ui, Roboto, sans-serif; }
#root { padding: 18px 22px 40px; }
.topnav { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.topnav button {
  border: none; background: transparent; padding: 7px 14px; font-size: 13px;
  color: var(--sub); cursor: pointer; border-radius: 8px; font-family: inherit; font-weight: 600;
}
.topnav button:hover { background: #E9EBEE; }
.topnav button.active { background: var(--azul); color: #fff; }
.topnav .sep { width: 1px; background: var(--border); margin: 4px 6px; }
.dash-header { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.dash-header-left { display: flex; align-items: center; gap: 12px; }
.dash-header-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--azul); display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
.dash-header h1 { margin: 0; font-size: 24px; color: var(--text); }
.dash-header p { margin: 0; font-size: 12.5px; color: var(--sub); }
.filtro-pill { display: flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; }
.filtro-pill .fp-label { font-size: 10px; color: var(--sub); display: block; }
.filtro-pill .fp-value { font-size: 12px; color: var(--text); font-weight: 700; display: block; }
.filtro-pill select.fp-select { font: inherit; font-size: 12px; color: var(--text); font-weight: 700; border: none; background: transparent; outline: none; cursor: pointer; appearance: none; padding: 0; margin: 0; }
.grid-row { display: grid; gap: 16px; margin-bottom: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 3px rgba(16,24,40,0.06); height: 100%; }
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
.card-icon { width: 32px; height: 32px; border-radius: 50%; background: #EAF1FB; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.card-title { font-size: 15px; font-weight: 700; color: var(--text); margin: 0; }
.card-subtitle { font-size: 12px; color: var(--sub); margin: 2px 0 14px 42px; }
.stat-grid { display: flex; flex-wrap: wrap; gap: 14px; height: 100%; }
.stat-card { flex: 1 1 210px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(16,24,40,0.06); }
.stat-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.stat-icon { width: 26px; height: 26px; border-radius: 50%; background: #EAF1FB; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.stat-label { font-size: 12px; color: var(--sub); font-weight: 600; }
.stat-value { font-size: 21px; font-weight: 800; color: var(--text); margin: 1px 0; line-height: 1.2; }
.stat-sub { font-size: 11px; color: var(--sub); margin-top: 4px; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.badge-pos { background: var(--pos-bg); color: var(--pos-txt); }
.badge-neg { background: var(--neg-bg); color: var(--neg-txt); }
.badge-off { background: #EEF0F3; color: var(--sub); }
.dtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.dtable th { text-align: left; color: var(--sub); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.dtable td { padding: 7px 8px; border-bottom: 1px solid #F0F1F3; color: var(--text); }
.dtable tr:last-child td { border-bottom: none; font-weight: 700; }
.dtable td.num, .dtable th.num { text-align: right; white-space: nowrap; }
.rank-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.rank-num { width: 18px; font-size: 12px; color: var(--sub); font-weight: 700; flex-shrink: 0; }
.rank-name { width: 170px; font-size: 12px; color: var(--text); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-bar-track { flex: 1; background: #EEF0F3; border-radius: 4px; height: 11px; }
.rank-bar-fill { height: 100%; border-radius: 4px; }
.rank-val { width: 92px; text-align: right; font-size: 11.5px; color: var(--text); font-weight: 600; flex-shrink: 0; }
.rank-pct { width: 46px; text-align: right; font-size: 12px; color: var(--text); font-weight: 700; flex-shrink: 0; }
.empty-state { display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 13px; text-align: center; padding: 30px 20px; height: 100%; }
.conc-row { display: flex; gap: 14px; margin-top: 12px; }
.conc-item { flex: 1; text-align: center; }
.conc-label { font-size: 11.5px; color: var(--sub); margin-bottom: 4px; }
.conc-value { font-size: 19px; font-weight: 800; color: var(--azul); }
.mini-stat { display: flex; align-items: center; gap: 8px; }
.mini-stat .mini-val { font-size: 15px; font-weight: 800; color: var(--text); line-height: 1.15; }
.mini-stat .mini-label { font-size: 11px; color: var(--sub); }
select.aduana-select, .seg-control { font-family: inherit; }
select.aduana-select {
  width: 100%; padding: 9px 12px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--card); color: var(--text); margin-bottom: 10px;
}
.seg-control { display: inline-flex; background: #EEF0F3; border-radius: 8px; padding: 3px; margin-bottom: 10px; }
.seg-control button {
  border: none; background: transparent; padding: 6px 14px; font-size: 12.5px; font-weight: 600;
  color: var(--sub); cursor: pointer; border-radius: 6px; font-family: inherit;
}
.seg-control button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(16,24,40,0.1); }
.breadcrumb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--sub); margin-bottom: 10px; min-height: 24px; }
.breadcrumb-back {
  display: flex; align-items: center; gap: 4px; font-size: 12px; font-family: inherit;
  color: var(--azul); background: #EEF1F5; border: 1px solid var(--border); border-radius: 5px;
  padding: 3px 9px; cursor: pointer; margin-right: 8px;
}
.breadcrumb-sep { color: #b7c0c9; }
.breadcrumb-item { cursor: pointer; text-decoration: underline; }
.breadcrumb-item.actual { cursor: default; font-weight: 700; color: var(--azul); text-decoration: none; }

/* Telefono: todo grid de 2+ columnas se apila a 1 sola (las columnas con
   ancho fijo en px, como la dona de Tarjeta de Credito a 480px, tambien
   quedan cubiertas por el !important). Las tablas anchas (Estado de
   Resultados, detalle de conceptos) se dejan scrollear horizontal dentro
   de su propia tarjeta en vez de romper el layout de la pagina. */
@media (max-width: 760px) {
  #root { padding: 12px 12px 30px; }
  .topnav { gap: 2px; }
  .topnav button { padding: 6px 10px; font-size: 12px; }
  .dash-header { flex-direction: column; align-items: flex-start; }
  .dash-header h1 { font-size: 19px; }
  .grid-row { grid-template-columns: 1fr !important; }
  .donut-detalle-row { flex-direction: column; }
  .donut-detalle-row > div:first-child { flex: none !important; width: 220px !important; margin: 0 auto; }
  .card { overflow-x: auto; }
  .dtable { font-size: 11.5px; }
  .rank-name { width: 92px; }
  .rank-val { width: 72px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Puente minimo al protocolo de Streamlit Components (postMessage), identico
   al ya usado en components/treemap_click/index.html de este mismo tablero. */
const Streamlit = {
  _send(payload) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, payload), "*"); },
  init() {
    window.addEventListener("message", (event) => {
      const d = event.data;
      if (!d || d.type !== "streamlit:render") return;
      render((d.args) || {});
    });
    this._send({ type: "streamlit:componentReady", apiVersion: 1 });
  },
  setComponentValue(value) { this._send({ type: "streamlit:setComponentValue", value: value, dataType: "json" }); },
  setFrameHeight(height) { this._send({ type: "streamlit:setFrameHeight", height: height }); },
};

const h = React.createElement;
const { useState, useMemo } = React;
const { ResponsiveContainer, BarChart, Bar, LineChart, Line, PieChart, Pie, Cell,
        XAxis, YAxis, CartesianGrid, Tooltip, Legend, ReferenceLine, LabelList, Treemap } = Recharts;

const ICONOS = {
  money: "💵", target: "🎯", people: "👥", chart: "📊", building: "🏢", trophy: "🏆",
  box: "📦", trend: "📈", calendar: "📅", year: "📆", filtro: "🗂️", pin: "📍",
  stack: "🗃️", gauge: "⏱️", list: "📋", doc: "📄", hex: "⬡",
};
const PALETA = ["#244072", "#507058", "#8a6d4b", "#4a7fa8", "#7a9e6e", "#c98a2e",
                "#6f5c8a", "#9aa5b1", "#a45c6b", "#3f8f8a"];
function colorFor(i) { return i === -1 ? "#c9cdd3" : PALETA[i % PALETA.length]; }

function fmt(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  const s = v < 0 ? "-$" : "$";
  return s + Math.round(Math.abs(v)).toLocaleString("en-US");
}
function pct(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  return (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
}

/* ── Piezas basicas (iguales a las tarjetas HTML que ya se usaban, ahora */
/*    como componentes React de verdad) ─────────────────────────────── */
function CardHeader(props) {
  return h("div", { className: "card-header" },
    h("div", { className: "card-icon" }, ICONOS[props.icono] || "•"),
    h("p", { className: "card-title" }, props.titulo),
    props.badge ? h("span", { className: "badge badge-off", style: { marginLeft: "auto" } }, props.badge) : null
  );
}

function Badge(props) {
  if (!props.texto) return null;
  const cls = props.positivo === true ? "badge-pos" : props.positivo === false ? "badge-neg" : "badge-off";
  const flecha = props.positivo === true ? "▲ " : props.positivo === false ? "▼ " : "";
  return h("span", { className: "badge " + cls }, flecha + props.texto);
}

function StatGrid(props) {
  return h("div", { className: "card", style: { padding: 0, border: "none", background: "transparent", boxShadow: "none" } },
    h("div", { className: "stat-grid" }, props.cards.map((c, i) => h("div", { className: "stat-card", key: i },
      h("div", { className: "stat-top" },
        h("div", { className: "stat-icon" }, ICONOS[c.icono] || "•"),
        h("div", { className: "stat-label" }, c.label)),
      h("div", { className: "stat-value" }, c.valor),
      h(Badge, { texto: c.deltaTxt, positivo: c.deltaPos }),
      c.sub ? h("div", { className: "stat-sub" }, c.sub) : null,
      c.barra ? h(BarraRealPpto, c.barra) : null
    )))
  );
}

function BarraRealPpto(props) {
  const { real, ppto, color } = props;
  if (!ppto || ppto <= 0) return null;
  const techo = Math.max(real, ppto) * 1.15 || 1;
  const fracReal = Math.max(0, Math.min(1, real / techo)) * 100;
  const fracPpto = Math.max(0, Math.min(1, ppto / techo)) * 100;
  return h("div", { style: { position: "relative", height: 12, background: "#eceff2", borderRadius: 3, margin: "8px 0 2px" } },
    h("div", { style: { position: "absolute", left: 0, top: 0, height: "100%", width: fracReal + "%", background: color, borderRadius: 3 } }),
    h("div", { style: { position: "absolute", left: fracPpto + "%", top: -2, height: 16, width: 2, background: "var(--ambar)" } })
  );
}

function EmptyCard(props) {
  return h("div", { className: "card" },
    h(CardHeader, { icono: props.icono, titulo: props.titulo }),
    props.subtitulo ? h("p", { className: "card-subtitle" }, props.subtitulo) : null,
    h("div", { className: "empty-state" }, props.mensaje));
}

function BarChartCard(props) {
  const { icono, titulo, subtitulo, categorias, real, ppto, nombreReal, nombrePpto, colorReal, colorPpto, nota } = props;
  const data = categorias.map((c, i) => ({ cat: c, real: real[i], ppto: ppto[i] }));
  return h("div", { className: "card" },
    h(CardHeader, { icono, titulo }),
    h("p", { className: "card-subtitle" }, subtitulo),
    h("div", { style: { height: 230 } },
      h(ResponsiveContainer, { width: "100%", height: "100%" },
        h(BarChart, { data, margin: { top: 6, right: 10, left: 0, bottom: 0 } },
          h(CartesianGrid, { strokeDasharray: "3 3", vertical: false }),
          h(XAxis, { dataKey: "cat", tick: { fontSize: 11, fill: "#6B7280" }, axisLine: { stroke: "#E3E6EA" } }),
          h(YAxis, { tickFormatter: fmt, tick: { fontSize: 10, fill: "#6B7280" }, axisLine: { stroke: "#E3E6EA" } }),
          h(Tooltip, { formatter: (v) => fmt(v) }),
          h(Legend, { wrapperStyle: { fontSize: 12 } }),
          h(Bar, { dataKey: "real", name: nombreReal, fill: colorReal, radius: [3, 3, 0, 0], maxBarSize: 46 }),
          h(Bar, { dataKey: "ppto", name: nombrePpto, fill: colorPpto, radius: [3, 3, 0, 0], maxBarSize: 46 })
        ))),
    nota ? h("p", { style: { margin: "6px 0 0", fontSize: 11, color: "var(--sub)", textAlign: "center" } }, nota) : null
  );
}

function LineChartCard(props) {
  const { icono, titulo, subtitulo, categorias, real, ppto, nombreReal, nombrePpto, colorReal, colorPpto, nota, pctMode, yDomain, yTicks } = props;
  const data = categorias.map((c, i) => ({ cat: c, real: real[i], ppto: ppto[i] }));
  const fmtEje = pctMode ? ((v) => (v * 100).toFixed(2) + "%") : fmt;
  // Margen del eje proporcional al rango de los datos (12%) en vez de un
  // valor fijo -- un fijo pensado para porcentajes (ej. 0.02 = 2 puntos)
  // resulta invisible cuando los valores son cifras en millones. Si el
  // caller manda yDomain/yTicks explicitos (rango y lineas de referencia
  // fijos, pedido por el usuario para Ingresos), esos tienen prioridad.
  const valoresEje = [...real, ...ppto].filter((v) => typeof v === "number" && !isNaN(v));
  const maxAbsEje = Math.max(...valoresEje.map(Math.abs), 0) || 1;
  const margenEje = maxAbsEje * 0.12;
  return h("div", { className: "card" },
    h(CardHeader, { icono, titulo }),
    h("p", { className: "card-subtitle" }, subtitulo),
    h("div", { style: { height: 230 } },
      h(ResponsiveContainer, { width: "100%", height: "100%" },
        h(LineChart, { data, margin: { top: 6, right: 10, left: 0, bottom: 0 } },
          h(CartesianGrid, { strokeDasharray: "3 3", vertical: false }),
          h(XAxis, { dataKey: "cat", tick: { fontSize: 11, fill: "#6B7280" }, axisLine: { stroke: "#E3E6EA" } }),
          h(YAxis, {
            // Sin 'domain' explicito, Recharts usa el min/max exacto de los
            // datos como techo/piso del eje -- con una sola categoria y
            // ppto fijo en 0%, el punto de Presupuesto cae justo en el
            // borde del area del grafico y Recharts lo recorta (se ve
            // "cortado"/invisible). Un margen fijo de aire arriba/abajo lo
            // resuelve sin depender de que los valores sean negativos o no.
            tickFormatter: fmtEje, tick: { fontSize: 10, fill: "#6B7280" }, axisLine: { stroke: "#E3E6EA" },
            domain: yDomain || [(dataMin) => Math.min(dataMin, 0) - margenEje, (dataMax) => Math.max(dataMax, 0) + margenEje],
            ticks: yTicks || undefined,
          }),
          h(Tooltip, { formatter: (v) => fmtEje(v) }),
          h(Legend, { wrapperStyle: { fontSize: 12 } }),
          h(Line, {
            type: "monotone", dataKey: "real", name: nombreReal, stroke: colorReal, strokeWidth: 3, dot: { r: 5 },
            label: { position: "top", formatter: fmtEje, fontSize: 11, fontWeight: 700, fill: colorReal },
          }),
          h(Line, {
            type: "monotone", dataKey: "ppto", name: nombrePpto, stroke: colorPpto, strokeWidth: 2, strokeDasharray: "5 3",
            dot: { r: 5, strokeDasharray: "0", fill: colorPpto, stroke: "#fff", strokeWidth: 1.5 },
            label: { position: "bottom", formatter: fmtEje, fontSize: 11, fontWeight: 700, fill: "#6B7280" },
          })
        ))),
    nota ? h("p", { style: { margin: "6px 0 0", fontSize: 11, color: "var(--sub)", textAlign: "center" } }, nota) : null
  );
}

function DonutDetalleCard(props) {
  const { titulo, subtitulo, serieDona, totalTxt, subtotalTxt, tituloCol1, filasTabla } = props;
  const data = serieDona.map((d, i) => ({ nombre: d.concepto, valor: d.monto, color: colorFor(d.concepto === "Otros" ? -1 : i) }));
  const totTabla = filasTabla.reduce((s, f) => s + f.monto, 0) || 1;
  return h("div", { className: "card", style: { display: "flex", flexDirection: "column" } },
    h(CardHeader, { icono: "chart", titulo }),
    h("p", { className: "card-subtitle" }, subtitulo),
    h("div", { className: "donut-detalle-row", style: { display: "flex", gap: 10, alignItems: "center", flex: 1 } },
      h("div", { style: { flex: "0 0 36%", position: "relative" } },
        h("div", { style: { height: 170 } },
          h(ResponsiveContainer, { width: "100%", height: "100%" },
            h(PieChart, {},
              h(Pie, { data, dataKey: "valor", nameKey: "nombre", innerRadius: 44, outerRadius: 75, paddingAngle: 1 },
                data.map((d, i) => h(Cell, { key: i, fill: d.color, stroke: "#fff", strokeWidth: 2 }))),
              h(Tooltip, { formatter: (v) => fmt(v) })))),
        h("div", { style: { position: "absolute", top: "85px", left: "50%", transform: "translate(-50%,-50%)", textAlign: "center", pointerEvents: "none" } },
          h("div", { style: { fontSize: 13, fontWeight: 800, color: "var(--azul)" } }, totalTxt),
          h("div", { style: { fontSize: 9.5, color: "var(--sub)" } }, subtotalTxt))),
      h("div", { style: { flex: 1, minWidth: 0, maxHeight: 220, overflowY: "auto", overflowX: "auto" } },
        h("table", { className: "dtable", style: { minWidth: 420 } },
          h("tbody", {},
            h("tr", {}, h("th", {}, tituloCol1), h("th", { className: "num" }, "Monto actual"),
                       h("th", { className: "num" }, "% Part."), h("th", { className: "num" }, "Monto anterior"),
                       h("th", { className: "num" }, "Var. $"), h("th", { className: "num" }, "Var. %")),
            filasTabla.map((f, i) => h("tr", { key: i },
              h("td", {}, f.concepto), h("td", { className: "num" }, fmt(f.monto)),
              h("td", { className: "num" }, pct(f.monto / totTabla)),
              h("td", { className: "num", style: { color: "var(--sub)" } }, "—"),
              h("td", { className: "num", style: { color: "var(--sub)" } }, "—"),
              h("td", { className: "num", style: { color: "var(--sub)" } }, "—"))),
            h("tr", {}, h("td", {}, "Total"), h("td", { className: "num" }, fmt(totTabla)),
                       h("td", { className: "num" }, "100%"), h("td", { className: "num" }, "—"),
                       h("td", { className: "num" }, "—"), h("td", { className: "num" }, "—"))
          )))));
}

function RankingConcentracionCard(props) {
  const { titulo, subtitulo, badge, items, color, etqContraparte, etqContraparteSing } = props;
  const tot = items.reduce((s, d) => s + d.monto, 0) || 1;
  const maxv = Math.max(...items.map((d) => d.monto), 1);
  const ordenado = [...items].sort((a, b) => b.monto - a.monto);
  const top5 = ordenado.slice(0, 5).reduce((s, d) => s + d.monto, 0) / tot;
  const top10 = ordenado.slice(0, 10).reduce((s, d) => s + d.monto, 0) / tot;
  const principal = ordenado.length ? ordenado[0].monto / tot : 0;
  return h("div", { className: "card" },
    h(CardHeader, { icono: "people", titulo, badge }),
    h("p", { className: "card-subtitle" }, subtitulo),
    items.map((it, i) => h("div", { className: "rank-row", key: i },
      h("div", { className: "rank-num" }, i + 1),
      h("div", { className: "rank-name", title: it.nombre }, it.nombre),
      h("div", { className: "rank-bar-track" }, h("div", { className: "rank-bar-fill", style: { width: (it.monto / maxv * 100) + "%", background: color } })),
      h("div", { className: "rank-val" }, fmt(it.monto)),
      h("div", { className: "rank-pct" }, (it.monto / tot * 100).toFixed(1) + "%"))),
    h("div", { style: { borderTop: "1px solid var(--border)", marginTop: 6, paddingTop: 12 } },
      h("div", { className: "card-header", style: { marginBottom: 0 } },
        h("div", { className: "card-icon" }, ICONOS.trophy),
        h("p", { className: "card-title", style: { fontSize: 13 } }, "Concentración")),
      h("div", { className: "conc-row" },
        h("div", { className: "conc-item" }, h("div", { className: "conc-label" }, "Top 5 " + etqContraparte.toLowerCase()), h("div", { className: "conc-value" }, pct(top5))),

  function BarraReal(p) {
    const { x, y, width, height, payload } = p;

    const wReal = Math.abs(width);

/* ── Tarjeta de Crédito: dona anidada (Facturado/No Facturado + proveedor) */
/*    y velocímetro semicircular -- mismo trazo SVG a mano que gauge_svg()  */
/*    del lado de Python, ahora calculado en el navegador. ──────────────── */
function GaugeSemicircular(props) {
  const frac = Math.max(0, Math.min(1, props.frac));
  const bandas = props.bandas;
  const cx = 130, cy = 122, rOut = 92, rIn = 60;
  function punto(r, angDeg) {
    const rad = (Math.PI / 180) * angDeg;
    return [cx + r * Math.cos(rad), cy - r * Math.sin(rad)];
  }
  function arco(aIni, aFin) {
    const [x1o, y1o] = punto(rOut, aIni), [x2o, y2o] = punto(rOut, aFin);
    const [x1i, y1i] = punto(rIn, aFin), [x2i, y2i] = punto(rIn, aIni);
    return `M ${x1o.toFixed(2)} ${y1o.toFixed(2)} A ${rOut} ${rOut} 0 0 1 ${x2o.toFixed(2)} ${y2o.toFixed(2)} L ${x1i.toFixed(2)} ${y1i.toFixed(2)} A ${rIn} ${rIn} 0 0 0 ${x2i.toFixed(2)} ${y2i.toFixed(2)} Z`;
  }
  const piezas = [];
  let a = 180.0;
  bandas.forEach(([proporcion, color], i) => {
    const a2 = a - proporcion * 180.0;
    piezas.push(h("path", { key: "b" + i, d: arco(a, a2), fill: color }));
    a = a2;
  });
  const marcas = [];
  for (let p = 0; p <= 100; p += 10) {
    const ang = 180.0 - (p / 100.0) * 180.0;
    const [x1, y1] = punto(rOut + 2, ang), [x2, y2] = punto(rOut + 8, ang), [xt, yt] = punto(rOut + 19, ang);
    marcas.push(h("line", { key: "l" + p, x1, y1, x2, y2, stroke: "#8a95a1", strokeWidth: 1.5 }));
    marcas.push(h("text", { key: "t" + p, x: xt, y: yt, textAnchor: "middle", fontSize: 9, fill: "#8a95a1" }, p + "%"));
  }
  const angAguja = 180.0 - frac * 180.0;
  const [xa, ya] = punto(rIn - 6, angAguja);
  return h("div", { style: { display: "flex", justifyContent: "center" } },
    h("svg", { viewBox: "0 0 260 195", width: 280, height: 210 },
      piezas, marcas,
      h("line", { x1: cx, y1: cy, x2: xa, y2: ya, stroke: props.colorAguja, strokeWidth: 4, strokeLinecap: "round" }),
      h("circle", { cx, cy, r: 7, fill: props.colorAguja }),
      h("text", { x: cx, y: cy + 34, textAnchor: "middle", fontSize: 26, fontWeight: 700, fill: props.colorAguja }, Math.round(frac * 100) + "%"),
      h("text", { x: cx, y: cy + 52, textAnchor: "middle", fontSize: 12, fill: "#54616f" }, props.etiqueta || "del gasto facturado")));
}
function DonaAnidadaTarjeta(props) {

  const PISO = 0.03;
  const totExt = porProveedor.reduce((s, d) => s + d.monto, 0) || 1;
  const esChica = porProveedor.map((d) => d.monto / totExt < PISO);
  const nChicas = esChica.filter(Boolean).length;
  let dataExt;

    const sumaGrandes = porProveedor.reduce((s, d, i) => s + (esChica[i] ? 0 : d.monto), 0);
    const escala = sumaGrandes ? (1 - presupuestoChicas) * totExt / sumaGrandes : 1;

      h("div", { style: { display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--sub)" } },
        h("span", { style: { width: 10, height: 10, borderRadius: 2, background: colorFact, display: "inline-block" } }), "Facturado"),
      h("div", { style: { display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "var(--sub)" } },

          h(Pie, { data: dataExt, dataKey: "valorAngulo", nameKey: "nombre", cx: "50%", cy: "50%", innerRadius: "58%", outerRadius: "98%" },

const TABS = [

function App(props) {

  const datosPorTab = {

    "Nómina": d.nomina, "Tarjeta de Crédito": d.tarjeta_credito,
  };
  const datosActivos = datosPorTab[tab];
  const mesTxt = (datosActivos && datosActivos.mes_txt) || (d.utilidad_operativa && d.utilidad_operativa.mes_txt) || "—";

  const aduanaFiltro = d.aduana_filtro || "TODAS";

  let paginaEl;
  if (tab === "Utilidad Operativa") paginaEl = h(UtilidadOperativaPage, { datos: d.utilidad_operativa, colores: d.colores });

  const iconoHeader = h("div", { className: "dash-header-icon" }, ICONOS[activa.icono] || ICONOS.chart);
  const tituloHeader = h("div", {}, h("h1", {}, activa.titulo), h("p", {}, activa.subtitulo));

  const pillAduana = tab !== "Utilidad Operativa" ? h("div", { className: "filtro-pill" },
    h("span", {}, ICONOS.pin),
    h("span", {},

let root = null;
function medirYReportarAltura() {
  /* document.documentElement.scrollHeight se infla con el span de medicion
     de texto que Recharts inserta fuera de pantalla (top:-20000px); el alto
     real de contenido esta en body.scrollHeight. */
  Streamlit.setFrameHeight(document.body.scrollHeight + 20);
}
function render(args) {
  if (!args || !args.datos) return;
  if (!root) {
    root = ReactDOM.createRoot(document.getElementById("root"));
    /* Recalcula la altura ante CUALQUIER cambio de layout (cambio de
       pestana, toggle Top5/Todas, dropdown de aduana, etc.) -- todo eso
       pasa por estado de React del lado del cliente, sin volver a llamar
       a render() via postMessage, asi que un solo ResizeObserver sobre la
       raiz cubre todos esos casos sin tener que listar cada pieza de estado. */
    new ResizeObserver(() => medirYReportarAltura()).observe(document.getElementById("root"));
  }
  root.render(h(App, { datos: args.datos }));
  setTimeout(medirYReportarAltura, 60);
  setTimeout(medirYReportarAltura, 400);
}
window.addEventListener("resize", medirYReportarAltura);

Streamlit.init();
